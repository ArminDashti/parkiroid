name: parkiroid

services:
  parkiroid-webui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://dogan-api.xaigrok.ir/dogan/api/v1}
    image: ${IMAGE_TAG:-parkiroid-webui:latest}
    container_name: parkiroid-webui
    expose:
      - "80"
    volumes:
      - parkiroid-webui-vol:/data
    networks:
      - t3-net
    restart: "no"

networks:
  t3-net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true

volumes:
  parkiroid-webui-vol:
    name: parkiroid-webui-vol
